model = "gpt-5.6-terra"
model_reasoning_effort = "high"

[agents]
max_threads = 4
max_depth = 1

[agents.explorer]
description = "Read-only repository discovery and decision-ready findings."
config_file = "agents/explorer.toml"

[agents.quick-implementer]
description = "Strictly bounded one- or two-file implementation with focused checks."
config_file = "agents/quick-implementer.toml"

[agents.worker]
description = "Normal implementation within understood architecture."
config_file = "agents/worker.toml"

[agents.high-risk-implementer]
description = "Consequential implementation for semantic, protocol, lifecycle, or public-contract risk."
config_file = "agents/high-risk-implementer.toml"

[agents.recovery-implementer]
description = "Explicitly critical work or one controlled recovery after evidenced Sol High failure."
config_file = "agents/recovery-implementer.toml"

[agents.code-validator]
description = "Read-only execution and exact reporting of specified verification commands."
config_file = "agents/code-validator.toml"

[agents.code-reviewer]
description = "Read-only project review for consequential or specifically assigned questions."
config_file = "agents/code-reviewer.toml"

[agents.doc-maintainer]
description = "Strictly bounded documentation maintenance using established project structure."
config_file = "agents/doc-maintainer.toml"

[agents.commit-pusher]
description = "Explicitly authorized staging, commit, and push operations only."
config_file = "agents/commit-pusher.toml"

[agents.reforger-researcher]
description = "Read-only source-backed Reforger and Enfusion evidence collection."
config_file = "agents/reforger-researcher.toml"

[agents.reforger-reviewer]
description = "Read-only consequential review of Reforger evidence and conclusions."
config_file = "agents/reforger-reviewer.toml"
