[package]
name = "reforger_language_server"
version = "0.1.0"
edition = "2021"

[lib]
name = "reforger_language_server"
path = "src/lib.rs"

[dependencies]
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2.5"

[profile.dev]
opt-level = 2
